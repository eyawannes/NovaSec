<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - NovaSec</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <main class="login-section">

        <div class="login-card">

            <div class="logo">
                Nova<span>Sec</span>
            </div>

            <h2>Créer votre compte</h2>

            <p>
                Rejoignez NovaSec et protégez vos données.
            </p>

            <form method="POST"
                  action="{{ url_for('register') }}">

                <label for="username">
                    Nom d'utilisateur
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Votre nom"
                    required
                >

                <label for="email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemple@email.com"
                    required
                >

                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Votre mot de passe"
                    required
                >

                <button type="submit">
                    Créer mon compte
                </button>

            </form>

            <p>
                Vous avez déjà un compte ?
                <a href="{{ url_for('login') }}">
                    Se connecter
                </a>
            </p>

        </div>

    </main>

</body>

</html>
